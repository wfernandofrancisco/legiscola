<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Sem conexão — Legiscola</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            text-align: center;
        }
        main { max-width: 22rem; }
        h1 { margin: 0 0 12px; font-size: 1.35rem; }
        p { margin: 0 0 20px; color: #94a3b8; line-height: 1.5; font-size: 0.95rem; }
        button {
            appearance: none;
            border: 0;
            border-radius: 0.75rem;
            background: #06b6d4;
            color: #0f172a;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.75rem 1.25rem;
            min-height: 44px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Você está sem internet</h1>
        <p>O Legiscola precisa de conexão para carregar o conteúdo. Assim que a rede voltar, toque em tentar de novo.</p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
</body>
</html>
